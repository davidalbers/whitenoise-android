plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose.compiler)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.roborazzi)
    alias(libs.plugins.ktlint)
}

android {
    namespace = "dalbers.com.noise"

    compileSdk 37

    defaultConfig {
        applicationId "dalbers.com.noise"
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName "2.2"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    // This is an older version of exoplayer that isn't available on Maven anymore.
    // An issue in new versions (https://github.com/google/ExoPlayer/issues/8594) causes gaps in the
    // audio on certain very popular devices. Until that's fixed we're forced to use this.
    implementation files('../libs/exoplayer-release.aar')

    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.material
    implementation libs.androidx.compose.material.icons.core
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.compose.animation
    implementation libs.compose.settings.ui
    implementation libs.compose.settings.storage.preferences
    implementation libs.androidx.media
    implementation libs.hilt.android
    ksp libs.hilt.android.compiler

    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.arch.core.testing

    testImplementation libs.robolectric
    testImplementation libs.bundles.roborazzi
    testImplementation libs.composable.preview.scanner
    testImplementation platform(libs.androidx.compose.bom)
    testImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
}

android {
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
            }
        }
    }
}

roborazzi {
    outputDir.set(file("src/test/screenshots"))
    generateComposePreviewRobolectricTests.enable.set(true)
    generateComposePreviewRobolectricTests.packages.set(["dalbers.com.noise"])
    generateComposePreviewRobolectricTests.includePrivatePreviews.set(true)
}

ktlint {
    android = true
    ignoreFailures = false
    outputToConsole = true
}
