name: Record screenshots

# Screenshots must be recorded on CI to match perfectly. Run this on a branch that needs refreshed
# screenshots (for example on a branch adding UI or on master to fix tests).
on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Delete existing screenshots
        run: rm -rf app/src/test/screenshots

      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Commit updated screenshots
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A app/src/test/screenshots
          git diff --staged --quiet || git commit -m "Update reference screenshots from CI"
          git push
